<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fbf6ee" />
    <meta name="description" content="家里吃点啥 · 家庭点菜系统，数据保存在自己的 NAS / 本机" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="家里吃点啥" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <title>家里吃点啥 · 家庭点菜</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- 动效浮层：Vue 不托管，节点在加载时就固定好；运行时只改 class / CSS 变量，
         绝不动态增删 DOM，避免与 Vue 渲染产生 insertBefore 竞态 -->
    <div id="fx-layer" aria-hidden="true">
      <span class="sparkle"></span><span class="sparkle"></span><span class="sparkle"></span>
      <span class="sparkle"></span><span class="sparkle"></span><span class="sparkle"></span>
      <span class="confetti"></span><span class="confetti"></span><span class="confetti"></span>
      <span class="confetti"></span><span class="confetti"></span><span class="confetti"></span>
      <span class="confetti"></span><span class="confetti"></span><span class="confetti"></span>
      <span class="confetti"></span><span class="confetti"></span><span class="confetti"></span>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
