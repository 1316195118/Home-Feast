name: Publish container image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-image.yml"
      - "Dockerfile"
      - ".dockerignore"
      - "embed.go"
      - "go.mod"
      - "go.sum"
      - "cmd/**"
      - "internal/**"
      - "web/**"

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.4"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Verify Go modules
        run: |
          go mod verify
          go mod tidy -diff

      - name: Run Go checks
        run: |
          go vet ./...
          go test -count=1 ./...
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 ./...

      - name: Build frontend
        run: |
          npm --prefix web ci --no-audit --no-fund
          npm --prefix web audit --audit-level=high
          npm --prefix web run build

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      # 只有 release.py --publish 递增 VERSION 后才构建镜像并覆盖 latest。
      # 普通提交（修 bug / 改文档）只跑 verify，不推镜像，避免线上拉到
      # 「内容变了、版本号却没变」的镜像，也无法被在线更新感知。
      - name: Checkout with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect VERSION change
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          before="${{ github.event.before }}"
          if git cat-file -e "$before" 2>/dev/null \
             && ! git diff --quiet "$before" HEAD -- VERSION; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.ver.outputs.changed == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.ver.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.ver.outputs.changed == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image metadata
        if: steps.ver.outputs.changed == 'true'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/1316195118/home-feast
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and publish
        if: steps.ver.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          # 与 dist/manifest 的三架构矩阵保持一致（release.py 也产出 armv7）。
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
